<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3f75">
<title>EMT – Gestion de l'église</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#1f3f75;--brand-d:#14294d;--brand-l:#e6ecf6;--bg:#f3f5f6;--card:#fff;--tx:#1b2a2e;--mu:#6a7a7f;--bd:#e2e8ea;--ok:#2e8b57;--bad:#c0392b;--warn:#b7791f;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:flex;min-height:100vh}
.side{width:240px;background:#fff;border-right:1px solid var(--bd);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brandbar{background:var(--brand);color:#fff;padding:16px;display:flex;gap:10px;align-items:center}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:2px solid rgba(255,255,255,.6)}
.brandbar .n{font-weight:600;line-height:1.2;font-size:13.5px}
.brandbar .p{font-size:11.5px;opacity:.85}
.nav{padding:8px 0;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 18px;color:#3c4b50;text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:var(--brand-l)}
.nav a.on{background:var(--brand);color:#fff}
.main{flex:1;margin-left:240px;min-width:0}
.top{height:56px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.burger svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none}
.content{padding:18px 22px;max-width:1680px;margin:0 auto}
.banner{margin:0 0 14px;padding:10px 14px;border-radius:10px;font-size:13px;display:none}
.banner.show{display:block}
.banner.warn{background:#fff6e5;color:#7a4d00;border:1px solid #f3d9a4}
.banner.info{background:var(--brand-l);color:var(--brand-d);border:1px solid #8fa6cc}
.scrim{display:none}
@media (max-width:900px){
 .side{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.2)}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
 .main{margin-left:0}
 .burger{display:block}
 .content{padding:12px}
}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.grid2{grid-template-columns:1fr}}
.kpi .l{color:var(--mu);font-size:12.5px;font-weight:500}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mu);font-size:12px;margin-top:2px}
.sec{margin-top:14px}
.sec h2,.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
.muted{color:var(--mu)}.small{font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.inp{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;min-width:0}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #8fa6cc;border-color:var(--brand)}
.btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:#efc6c1}
.btn.ok{color:var(--ok);border-color:#bfe0cc}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.6}
.list{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--bd);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:#f8fbfb}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{color:var(--mu);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:#eef2f3;color:#46575c;white-space:nowrap}
.b-membre{background:#e3f4ea;color:#1f6b40}.b-visiteur{background:#fff1dc;color:#8a5a00}.b-nouveau{background:#e6eefc;color:#2a4f9a}.b-inactif{background:#eee;color:#777}
.b-todo{background:#fde8e6;color:#9a2b1f}.b-encours{background:#fff1dc;color:#8a5a00}.b-done{background:#e3f4ea;color:#1f6b40}
.chip{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--brand-l);color:var(--brand-d);font-size:11px;margin:2px 3px 0 0}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calhead .m{font-weight:600;font-size:16px;min-width:150px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cal .h{padding:8px 6px;font-size:12px;font-weight:600;color:var(--mu);text-align:center;border-bottom:1px solid var(--bd);background:#fafcfc}
.cell{min-height:92px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px;cursor:pointer;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.other{background:#fafbfb;color:#aab5b8}
.cell .dn{font-size:12px;font-weight:600;display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%}
.cell.today .dn{background:var(--brand);color:#fff}
.pill{display:block;font-size:10.5px;padding:2px 5px;border-radius:5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.k-rdv{background:#7a5cc7}.k-prog{background:#e8a53a}.k-event{background:#e0662d}.k-bday{background:#e46b84}
.more{font-size:10.5px;color:var(--mu)}
@media (max-width:600px){.cell{min-height:58px;padding:2px}.pill{font-size:0;height:6px;padding:0;margin-top:3px;border-radius:3px}.more{font-size:9px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,30,35,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
.mhead h3{margin:0;font-size:16px;flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--mu)}
.mbody{padding:16px 18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:12.5px;font-weight:600;color:#3c4b50}
.fld input,.fld select,.fld textarea{border:1px solid var(--bd);border-radius:9px;padding:9px 10px;background:#fff;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;padding:6px 0}
.multi{display:flex;flex-wrap:wrap;gap:6px 14px;border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
.multi label{display:flex;gap:6px;align-items:center;font-size:13px}
.mfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.mfoot .sp{flex:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mu)}.kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:110px 1fr}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2a2e;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}.toast.err{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:20px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:500;font-size:13px}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 10px;border-top:1px solid var(--bd);text-align:left}
table.t th{color:var(--mu);font-weight:600;font-size:12px;border-top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;max-height:260px;display:block}
.who{border-top:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.who img{width:30px;height:30px;border-radius:50%;flex:none}
.who .grow{flex:1;min-width:0}.who .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa{color:#1f8a4c!important;border-color:#bfe0cc!important}
/* ---- thème verre ---- */
body.glass{background:radial-gradient(1200px 600px at 10% -10%,#c9d6ee 0,transparent 60%),radial-gradient(900px 600px at 110% 10%,#e3e0f3 0,transparent 55%),radial-gradient(800px 500px at 50% 110%,#e3e0f3 0,transparent 60%),#eef3f5;background-attachment:fixed}
.glass .card,.glass .list,.glass .cal,.glass .side{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-color:rgba(255,255,255,.75);box-shadow:0 8px 30px rgba(20,60,70,.07)}
.glass .side{background:rgba(255,255,255,.62)}
.glass .top{background:rgba(31,63,117,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.glass .modal{background:rgba(15,40,45,.28);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.glass .mbox{background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8)}
.glass .cal .h{background:rgba(255,255,255,.35)}.glass .cell.other{background:rgba(255,255,255,.25)}
.glass .inp,.glass .btn:not(.primary),.glass .tab:not(.on){background:rgba(255,255,255,.7)}
.glass .row:hover{background:rgba(255,255,255,.55)}.glass .row{border-color:rgba(200,215,218,.6)}
/* ---- écran de connexion ---- */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(600px 400px at 15% 20%,rgba(96,130,200,.55),transparent 60%),radial-gradient(500px 400px at 85% 80%,rgba(70,110,200,.45),transparent 60%),linear-gradient(150deg,#0f1f3d,#14294d 45%,#2a2350);overflow:auto}
.login.hide{display:none}
.lcard{width:100%;max-width:360px;padding:30px 26px;border-radius:24px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 60px rgba(0,0,0,.3);color:#fff;text-align:center}
.lcard .sym{width:64px;height:64px;margin:0 auto 10px;filter:brightness(0) invert(1)}
.lcard .cn{font-size:13px;opacity:.85;letter-spacing:.3px;margin-bottom:14px}
.lcard h2{font-size:22px;margin:18px 0 4px}
.lcard p{margin:0 0 18px;font-size:13px;opacity:.85}
.lcard img.av2{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.6);margin-top:8px}
.lcard input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-size:18px;letter-spacing:6px;text-align:center;margin-bottom:10px}
.lcard input::placeholder{color:rgba(255,255,255,.6);letter-spacing:1px;font-size:14px}
.lcard input:focus{outline:2px solid rgba(255,255,255,.6)}
.lbtn{width:100%;padding:13px;border:0;border-radius:12px;background:#fff;color:#14294d;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px}
.lbtn:disabled{opacity:.6}
.llink{background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;cursor:pointer;margin-top:14px;font-size:12.5px}
.lerr{color:#ffd2cc;font-size:12.5px;margin-bottom:6px}.lerr:empty,.lok:empty{display:none}
.lfoot{font-size:11px;opacity:.65;margin-top:18px;line-height:1.4}
.csep{text-align:center;font-size:11px;color:var(--mu);margin:8px 0 2px}
.bub{max-width:78%;align-self:flex-start;background:#fff;border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:13.5px}
.bub.me{align-self:flex-end;background:#e6ecf6;border-color:#8fa6cc;border-radius:14px 14px 4px 14px}
.bub .bn{font-size:11.5px;font-weight:700;color:var(--brand-d);margin-bottom:2px}.bub .bt{font-size:10px;color:var(--mu);text-align:right;margin-top:2px}
.hdl{cursor:grab;font-size:18px;color:var(--mu);padding:0 4px;user-select:none}
.blk.over{outline:2px dashed var(--brand)}
.blk .inp{width:100%}
label.row{cursor:pointer}

.lcard .lin{letter-spacing:0;font-size:15px;text-align:left}
.lpw{position:relative}.lpw .lin{padding-right:46px}
.leye{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;color:#fff;opacity:.6;font-size:17px;cursor:pointer;border-radius:8px}.leye.on{opacity:1;background:rgba(255,255,255,.15)}
.lcaps{display:none;font-size:11.5px;color:#ffe08a;text-align:left;margin:-6px 0 8px}.lcaps.show{display:block}
.lhint{font-size:11.5px;opacity:.7;text-align:left;margin:-4px 0 10px}
.lhid{position:absolute!important;opacity:0;pointer-events:none;height:0!important;width:0!important;padding:0!important;border:0!important;margin:0!important}
.lstr{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:-4px 0 10px;overflow:hidden}.lstr i{display:block;height:100%;width:0;transition:width .2s}
.lsep{display:flex;align-items:center;gap:8px;margin:12px 0;opacity:.7;font-size:12px}.lsep span{flex:1;height:1px;background:rgba(255,255,255,.4)}
.lbtn.lg{display:flex;align-items:center;justify-content:center;gap:9px;color:#1f1f1f}
.lbtn.busy{position:relative;color:transparent!important}.lbtn.busy::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #14294d;border-right-color:transparent;border-radius:50%;animation:lspin .7s linear infinite}
.lbtn.busy .gico{opacity:0}
.ldr{padding:10px 0 4px}
.ldr-logo{position:relative;width:96px;height:96px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.ldr-logo img{width:62px;height:62px;object-fit:contain;animation:ldrPulse 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25))}
.ldr-ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;border-right-color:rgba(255,255,255,.6);animation:lspin 1.1s linear infinite}
.ldr-bar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin:18px 4px 8px}
.ldr-bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#9fc1ff,#fff,#9fc1ff);background-size:200% 100%;animation:ldrShine 1.4s linear infinite}
.ldr-row{display:flex;gap:10px;justify-content:space-between;white-space:nowrap;font-size:12.5px;opacity:.85;padding:0 4px}
@keyframes ldrPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes ldrShine{to{background-position:-200% 0}}
@keyframes lspin{to{transform:rotate(360deg)}}
.lrec{text-align:left;margin-bottom:4px}.lrt{font-size:12px;opacity:.75;margin-bottom:6px}
.lacc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);margin-bottom:8px;cursor:pointer}
.lacc:hover{background:rgba(255,255,255,.22)}.lacc.busy{opacity:.6}
.lav{width:36px;height:36px;border-radius:50%;background:#fff;color:#14294d;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.lai{flex:1;min-width:0;display:flex;flex-direction:column}.lai b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lai small{font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx{background:none;border:0;color:#fff;opacity:.5;font-size:18px;cursor:pointer;padding:4px 6px}
.lcard .ltabs{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.lcard .ltabs button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.lcard .ltabs button.on{background:#fff;color:#14294d}
.lok{color:#d9ffe9;font-size:12.5px;min-height:18px;margin-bottom:4px}

/* filigrane : logo de l'église en arrière-plan */
body::before{content:'';position:fixed;top:56px;bottom:0;left:240px;right:0;background:var(--wm) no-repeat center 55%/min(46vw,460px);opacity:.11;pointer-events:none;z-index:0}
.main{position:relative;z-index:1}
.top h1{text-align:center}
@media (min-width:901px){.top h1{padding-right:0}}
@media (max-width:900px){.top h1{margin-right:34px}}
@media (max-width:900px){body::before{left:0;background-size:min(75vw,380px)}}
.brandbar .p b{font-weight:700}

/* comportement « application » sur téléphone */
html,body{max-width:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav,.tabs,.btn,.tab,.top,.brandbar{-webkit-user-select:none;user-select:none}
.top{padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
.content{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media (max-width:900px){input,select,textarea,.inp{font-size:16px!important}}
@media (display-mode:standalone){html,body{height:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261121"></script>
</head>
<body>
